name: CI

# The PRD names two release-blocking gates — no cross-tenant read, and no
# cross-tenant AI retrieval — and until now they were enforced only when a
# human remembered to run `npm test`. CI must exist BEFORE the persistence
# rewrite, so the isolation suite guards that change rather than validating it
# after the fact.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  postgres:
    name: PostgreSQL persistence and tenant isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: propbrew_integration
          # The suites create nonowner test roles. This isolated service accepts
          # them only through the runner's loopback-bound disposable port.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d propbrew_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Real PostgreSQL migrations, rollback and persistence (release gate)
        env:
          PROPBREW_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/propbrew_integration
        run: npx vitest run --no-file-parallelism tests/data/native-postgres.integration.test.ts tests/data/workspace-postgres.integration.test.ts tests/data/company-accounts.integration.test.ts tests/data/company-ai-budget.integration.test.ts tests/data/demo-sandboxes.integration.test.ts tests/data/company-onboarding.integration.test.ts

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src tests --max-warnings 0

      - name: Tests
        run: npx vitest run

      # Release-blocking: tenant isolation must never regress.
      - name: Tenant isolation (release gate)
        run: npx vitest run tests/data/isolation.test.ts tests/authz

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Install browser for E2E
        run: npx playwright install --with-deps chromium

      - name: Browser E2E and accessibility smoke
        run: npm run test:e2e

      - name: Build
        run: npx next build

      - name: Migration presence
        run: test -s db/migrations/001_production_foundation.sql && test -s db/migrations/002_ng_pilot.sql && test -s db/migrations/003_domain_rows.sql && test -s db/migrations/004_operations_ai_comms.sql

      - name: Production env contract
        run: npm run check:production-env
